<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Màn hình xe - ACC</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">

  <!-- importmap: để file JS viết "import ... from 'three'" mà không cần build tool -->
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js" } }
  </script>
  <!-- Leaflet là bản UMD, tạo biến toàn cục L -->
  <script src="/vendor/leaflet/leaflet.js"></script>
</head>
<body>
  <main class="layout">

    <!-- ============ CỘT TRÁI: 3D + chỉ số đè lên ============ -->
    <section class="panel view3d" id="panel3d">
      <canvas id="c3d"></canvas>

      <div class="hud">
        <!-- Trên cùng: tốc độ (trái) - số (giữa) - giờ/nhiệt độ (phải) -->
        <div class="hud-top">
          <div class="speed-block">
            <div class="speed" id="speed">0</div>
            <div class="speed-unit">km/h</div>
            <!-- Biểu tượng ACC + tốc độ cài -->
            <div class="acc" id="accBadge">
              <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
                <path d="M3.5 12h5.3M15.2 12h5.3M12 14.3V20" stroke="currentColor" stroke-width="2" fill="none"/>
              </svg>
              <span id="setSpeed">--</span>
            </div>
          </div>

          <div class="gears" id="gears">
            <span data-g="P">P</span><span data-g="R">R</span><span data-g="N">N</span><span data-g="D">D</span>
          </div>

          <div class="right-block">
            <div class="clock-row"><span id="clock">--:--</span><span id="temp">--°C</span></div>
            <!-- Biển giới hạn tốc độ kiểu Việt Nam (P.127) -->
            <div class="limit-sign" id="limitSign"><span id="limit">--</span></div>
          </div>
        </div>

        <!-- Banner cảnh báo -->
        <div class="banner" id="banner" hidden></div>

        <!-- Dưới cùng: thông tin xe trước (trái) - nhiên liệu (phải) -->
        <div class="hud-bottom">
          <div class="lead-info" id="leadInfo">
            <div class="lead-title">Xe phía trước</div>
            <div class="lead-values">
              <span><b id="leadDist">--</b> m</span>
              <span><b id="leadSpeed">--</b> km/h</span>
            </div>
          </div>
          <div class="fuel">
            <div class="fuel-head"><span>Nhiên liệu</span><span><b id="range">--</b> km</span></div>
            <div class="fuel-bar"><div class="fuel-fill" id="fuelFill"></div></div>
          </div>
        </div>

        <!-- Chỉ báo nguồn dữ liệu + FPS -->
        <div class="status">
          <div class="source" id="source"><i></i><span>--</span></div>
          <div class="fps"><span id="fps">0</span> FPS</div>
        </div>
      </div>
    </section>

    <!-- ============ CỘT PHẢI: bản đồ ============ -->
    <section class="panel mapPanel">
      <div id="map"></div>
    </section>

  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
